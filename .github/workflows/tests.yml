name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV

    - name: Set up environment variables
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        ADMINS: '[1234567890]'
        DB_USER: 'postgres'
        DB_PASSWORD: 'postgres'
        DB_HOST: 'localhost'
        DB_PORT: '5432'
        DB_NAME: 'postgres'
        DB_ECHO: 'true'
      run: |
        echo "BOT_TOKEN=$BOT_TOKEN" >> $GITHUB_ENV
        echo "ADMINS=$ADMINS" >> $GITHUB_ENV
        echo "DB_USER=$DB_USER" >> $GITHUB_ENV
        echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
        echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV
        echo "DB_PORT=$DB_PORT" >> $GITHUB_ENV
        echo "DB_NAME=$DB_NAME" >> $GITHUB_ENV
        echo "DB_ECHO=$DB_ECHO" >> $GITHUB_ENV
        echo "WEBHOOK_URL=https://example.com" >> $GITHUB_ENV
        echo "WEBHOOK_PATH=/webhook" >> $GITHUB_ENV
        echo "APP_HOST=0.0.0.0" >> $GITHUB_ENV
        echo "APP_PORT=8080" >> $GITHUB_ENV
        echo "SHEET_ID=dummy_sheet_id" >> $GITHUB_ENV
        echo "GOOGLE_CREDENTIALS_FILE=dummy_credentials.json" >> $GITHUB_ENV
        echo "REDIS_HOST=redis" >> $GITHUB_ENV
        echo "REDIS_PORT=6379" >> $GITHUB_ENV
        echo "REDIS_DB=0" >> $GITHUB_ENV
        echo "CACHE_TTL=3600" >> $GITHUB_ENV

    - name: Lint with flake8
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
    
    - name: Check code formatting with black
      run: |
        black --check src/ tests/
    
    - name: Check import order with isort
      run: |
        isort --check-only src/ tests/
    
    - name: Run tests
      run: |
        pytest --cov=src --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false